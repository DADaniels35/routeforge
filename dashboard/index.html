<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RouteForge Dashboard</title>
    <link rel="stylesheet" href="/dashboard/styles.css" />
  </head>
  <body>
    <main>
      <section class="topbar">
        <div>
          <h1>RouteForge</h1>
          <p>Build a weighted logistics network and compare route algorithms.</p>
        </div>
        <button id="createGraph">New graph</button>
      </section>

      <section class="grid">
        <form id="vertexForm" class="panel">
          <h2>Locations</h2>
          <label>
            Location id
            <input id="vertexId" placeholder="warehouse_a" required />
          </label>
          <button>Add location</button>
        </form>

        <form id="edgeForm" class="panel">
          <h2>Connection</h2>
          <label>Source <input id="edgeSource" placeholder="warehouse_a" required /></label>
          <label>Destination <input id="edgeDestination" placeholder="hub_3" required /></label>
          <div class="metrics">
            <label>Cost <input id="edgeCost" type="number" min="0" step="0.01" value="10" /></label>
            <label>Distance <input id="edgeDistance" type="number" min="0" step="0.01" value="7" /></label>
            <label>Time <input id="edgeTime" type="number" min="0" step="0.01" value="30" /></label>
          </div>
          <button>Add connection</button>
        </form>

        <form id="routeForm" class="panel">
          <h2>Optimised Route</h2>
          <label>Source <input id="routeSource" placeholder="warehouse_a" required /></label>
          <label>Destination <input id="routeDestination" placeholder="customer_17" required /></label>
          <label>
            Optimise for
            <select id="routeMetric">
              <option value="cost">Cost</option>
              <option value="distance">Distance</option>
              <option value="travel_time">Travel time</option>
            </select>
          </label>
          <button>Calculate route</button>
        </form>

        <section class="panel output">
          <h2>Network</h2>
          <div class="stats">
            <span><strong id="vertexCount">0</strong> vertices</span>
            <span><strong id="edgeCount">0</strong> edges</span>
            <span><strong id="cycleState">No</strong> cycle</span>
          </div>
          <pre id="result">Create a graph to begin.</pre>
        </section>
      </section>
    </main>
    <script src="/dashboard/app.js"></script>
  </body>
</html>
